<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../authGuard.js"></script>
    <script src="../js/toast.js" defer></script>
    <script src="../js/theme.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LO$TKART</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../css/theme-utils.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

       <!-- Navbar (Matched to Homepage Theme) -->
    <nav class="navbar top-navbar">
        <div class="container-fluid top-navbar-container">
            <!-- Logo -->
            <a class="navbar-brand" href="../index.html">
                <img src="../../Images/logo.jpg" alt="LO$TKART Logo" width="30" height="24" class="me-2" onerror="this.style.display='none'">
                LO$TKART
            </a>

            <!-- Links -->
            <div class="top-nav-links">
                <a href="../index.html" class="top-nav-btn">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <!-- Dark Mode Toggle -->
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- Heading -->
        <div class="page-heading">
            <h1><i class="fa-solid fa-gauge-high"></i> My Dashboard</h1>
            <p>Manage and track all your lost and found item reports.</p>
        </div>

        <!-- Summary Cards (Initialized to 0) -->
        <div class="summary-cards">

            <div class="summary-card">
                <h3><i class="fa-solid fa-file-lines"></i> Total Reports</h3>
                <h2 id="totalCount">0</h2>
            </div>

            <div class="summary-card">
                <h3><i class="fa-solid fa-clock"></i> Pending</h3>
                <h2 id="pendingCount">0</h2>
            </div>

            <div class="summary-card">
                <h3><i class="fa-solid fa-circle-check"></i> Approved</h3>
                <h2 id="approvedCount">0</h2>
            </div>

            <div class="summary-card">
                <h3><i class="fa-solid fa-box-open"></i> Resolved / Claimed</h3>
                <h2 id="resolvedCount">0</h2>
            </div>

        </div>

        <!-- Item Report -->
        <div class="report-section">

            <div class="report-header">
                <h2><i class="fa-solid fa-clipboard-list"></i> Item Report</h2>

                <div class="filters">
                    <input type="text" id="searchInput" placeholder="Search item...">

                    <select id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="resolved">Resolved / Claimed</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Report Type</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <!-- Empty tbody: populated dynamically by dashboard.js -->
                    <tbody id="reportTable"></tbody>
                </table>

                <div class="no-results" id="noResults" style="display: block;">
                    Loading your reports...
                </div>
            </div>

        </div>

    </div>

    <script src="dashboard.js"></script>

</body>
</html>
