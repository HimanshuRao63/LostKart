<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./homepage/js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-T2D62RFK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
    </script>

    <title>Page Not Found | LO$TKART</title>
    <link rel="icon" type="image/jpg" href="./Images/logo.jpg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./homepage/css/theme-utils.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg-body);
        }

        .error-container {
            background: var(--color-surface-white);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 31, 63, 0.15);
            border: 1px solid rgba(0, 31, 63, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .error-code {
            font-family: var(--font-heading) !important;
            font-size: 8rem;
            font-weight: 800;
            color: var(--color-navy-700);
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0px rgba(255, 204, 0, 0.5);
        }

        .error-title {
            font-family: var(--font-heading) !important;
            color: var(--color-navy-700);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .error-text {
            color: var(--color-text-muted);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #185b9e 0%, #012c56 100%);
            color: #ffffff;
            font-family: var(--font-heading) !important;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 31, 63, 0.25);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 31, 63, 0.35), 0 0 15px rgba(255, 204, 0, 0.4);
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .error-container {
            background-color: #1e293b !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="dark"] .error-code,
        [data-theme="dark"] .error-title {
            color: #f8fafc !important;
        }

        [data-theme="dark"] .error-code {
            text-shadow: 4px 4px 0px rgba(255, 204, 0, 0.8);
        }

        [data-theme="dark"] .error-text {
            color: #94a3b8 !important;
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2D62K"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Theme Toggle -->
    <div style="position: absolute; top: 20px; right: 20px;">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-text">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            Let's get you back on track to finding your lost items.
        </p>
        <a href="./homepage/index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> Back to Homepage
        </a>
    </div>

</body>

</html>
