<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-T2D62RFK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
    </script>
    <script src="../homepage/js/theme.js"></script>
    <script src="../homepage/authGuard.js"></script>
    <script src="../homepage/js/toast.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Item</title>
    <link rel="stylesheet" href="found.css">
    <link rel="stylesheet" href="../homepage/css/theme-utils.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2D62K"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="form-container">
        
        <!-- Buttons inside the container -->
        <div class="page-controls">
            <button type="button" id="backHomeBtn" class="back-home-btn" onclick="window.location.href='../homepage/index.html'">&lt;</button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <h1>Found Item</h1>
        <p class="subtitle">Help return a lost item to its owner</p>

        <form id="uploadForm">
            <div class="form-group">
                <label>Upload Item Picture <span class="required">*</span></label>
                <div class="upload-box">
                    <span class="upload-icon">📷</span>
                    <p>Upload a picture</p>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" required>
                </div>
            </div>
            <img id="preview" style="display: none; width: 100%; border-radius: 10px; margin-bottom: 20px;">
            
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" required>
                    <option value="" disabled selected hidden>Select category</option>
                    <option value="stationary">Stationery</option>
                    <option value="electronics">Electronics</option>
                    <option value="documents">Documents</option>
                    <option value="accessories">Accessories</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location Found <span class="required">*</span></label>
                <input type="text" id="location" placeholder="e.g., Library" required>
            </div>
            <div class="form-group">
                <label for="description">Description <span class="required">*</span></label>
                <textarea id="description" rows="4" placeholder="Describe the item..."></textarea>
            </div>
            <button class="submit-btn" type="submit">Submit Found Item</button>
        </form>
    </div>
    <script src="founditem.js"></script>
</body>
</html>
