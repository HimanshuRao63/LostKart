<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../homepage/authGuard.js"></script>
    <script src="../homepage/js/theme.js"></script>
    <script src="../homepage/js/toast.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Item - LO$TKART</title>
    <link rel="stylesheet" href="Lost.css">
    <link rel="stylesheet" href="../homepage/css/theme-utils.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="form-container">
        
        <!-- Buttons inside the container -->
        <div class="page-controls">
            <button type="button" id="backHomeBtn" class="back-home-btn" onclick="window.location.href='../homepage/index.html'">&lt;</button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <h1>Lost Item</h1>
        <p class="subtitle">Report an item you have lost</p>
        
        <form id="lostForm">
            <div class="form-group">
                <label>Upload Item Photo <span>(Optional)</span></label>
                <div class="upload-box">
                    <span class="upload-icon">📷</span>
                    <p>Upload a picture of the lost item</p>
                    <span class="upload-text">JPG, PNG up to 5MB</span>
                    <input type="file" id="imageInput" accept="image/*" capture="environment">
                </div>
            </div>

            <img id="preview" style="display: none; width: 100%; border-radius: 10px; margin-bottom: 20px;">

            <div class="form-group">
                <label for="item-name">Item Name <span class="required">*</span> </label>
                <input type="text" id="item-name" required>
            </div>

            <div class="form-group">
                <label for="colour">Color <span class="required">*</span> </label>
                <input type="text" id="colour" required>
            </div>

            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="stationary">Stationery</option>
                    <option value="electronics">Electronics</option>
                    <option value="documents">Documents</option>
                    <option value="accessories">Accessories</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Lost Location <span class="required">*</span> </label>
               <input type="text" id="location" placeholder="e.g., Library, Cafeteria, P01,102" required>
            </div>

            <div class="form-group">
                <label for="time">Time <span>(Optional)</span></label>
                <input type="time" id="time">
            </div>

            <div class="form-group">
                <label for="date">Date <span class="required">*</span> </label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="description">Description <span class="required">*</span> </label>
                <textarea id="description" rows="4" placeholder="Describe the item..."></textarea>
            </div>

            <button class="submit-btn" type="submit">Submit Lost Item</button>
        </form>
    </div>

    <script src="lostitem.js"></script>
</body>
</html>
